<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<title>Lower third tin tức</title>
<!-- DTD Studio · lower third tin tức. Sửa chữ: các phần tử có data-field. Màu: biến --accent. -->
<style>
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;
    font-family:"Montserrat","Avenir Next","Helvetica Neue",-apple-system,sans-serif}
  :root{--accent:#5172BE;--ink:#1f2633;--paper:#ffffff}
  .row{position:absolute;left:64px;top:780px;width:1300px;height:240px;transform-origin:left bottom;scale:.7}
  .pg{position:absolute}
  .s20{clip-path:polygon(20% 0,100% 0,80% 100%,0 100%)}
  /* ---- lower third ---- */
  .lt{position:absolute;left:0;top:0;width:1290px;height:240px}
  .bar{left:0;top:56px;width:1290px;height:152px;background:var(--accent);
       clip-path:polygon(60px 0,100% 0,calc(100% - 52px) 100%,0 100%);transform-origin:left;transform:scaleX(0)}
  .title{left:414px;top:56px;height:152px;line-height:152px;width:820px;color:#fff;font-weight:800;font-size:74px;
         letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(40px)}
  .tag{left:50px;top:0;width:350px;height:160px;background:var(--paper);
       clip-path:polygon(70px 0,100% 0,280px 100%,0 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;
       opacity:0;transform:translateY(-50px)}
  .tag .label{color:var(--accent);font-weight:800;font-size:40px;line-height:1.02;text-transform:uppercase;text-align:center;
             max-width:200px;max-height:2.2em;overflow:hidden;overflow-wrap:anywhere}
  .tag img{max-width:200px;max-height:112px;object-fit:contain;display:none}
  .tag.has-logo img{display:block}.tag.has-logo div{display:none}
  .sub{top:182px;height:58px;background:var(--paper);line-height:58px;font-weight:700;white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis;text-align:center;opacity:0;transform:translateY(24px)}
  .clock{left:24px;width:162px;color:var(--accent);font-size:33px;clip-path:polygon(22px 0,100% 0,calc(100% - 22px) 100%,0 100%)}
  .desc{left:174px;width:706px;color:var(--ink);font-size:25px;text-transform:uppercase;padding:0 30px;box-sizing:border-box;
        clip-path:polygon(22px 0,100% 0,calc(100% - 22px) 100%,0 100%)}
  .loc{left:866px;width:250px;color:var(--ink);font-size:25px;text-transform:uppercase;padding:0 26px;box-sizing:border-box;
       clip-path:polygon(22px 0,100% 0,calc(100% - 22px) 100%,0 100%)}
  /* ---- animation ---- */
  .on .bar{animation:wipe .5s cubic-bezier(.7,0,.2,1) forwards}
  .on .tag{animation:drop .5s .2s cubic-bezier(.2,1.3,.4,1) forwards}
  .on .title{animation:show .45s .45s ease-out forwards}
  .on .sub{animation:show .4s ease-out forwards}
  .on .clock{animation-delay:.55s}.on .desc{animation-delay:.63s}.on .loc{animation-delay:.71s}
  .off .bar{transform:none}.off .tag,.off .title,.off .sub{opacity:1;transform:none}
  .off .lt{animation:outL .5s cubic-bezier(.7,0,.8,.4) forwards}
  @keyframes wipe{to{transform:none}}
  @keyframes drop{to{transform:none;opacity:1}}
  @keyframes show{to{transform:none;opacity:1}}
  @keyframes outL{to{transform:translateX(-110%);opacity:0}}
  .hide{display:none!important}
</style></head>
<body><div id="root"><div class="row">
  <div class="lt">
    <div class="pg bar" data-layer="bar" data-label="Thanh màu"></div>
    <div class="pg title" data-field="title" data-label="Tiêu đề chính">TIÊU ĐỀ BẢN TIN</div>
    <div class="pg tag" id="tag" data-layer="tag" data-label="Khối nhãn / logo"><img data-field="logo" data-type="image" alt=""><div class="label" data-field="label" data-label="Nhãn (tự xuống dòng)">DTD STUDIO</div></div>
    <div class="pg sub clock" data-field="clock" data-label="Giờ (trống = giờ thực)"></div>
    <div class="pg sub desc" data-field="desc" data-label="Dòng mô tả">Thông tin bổ sung cho bản tin</div>
    <div class="pg sub loc" data-field="loc" data-label="Địa điểm">Hà Nội</div>
  </div>
</div></div>
<script>
  const root=document.getElementById('root');let manual='';
  function hhmm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  function tick(){const t=manual||hhmm();document.querySelector('.clock').textContent=t;}
  function update(d){if(typeof d==='string')d=JSON.parse(d);
    for(const k in d){const v=String(d[k]??'');
      if(k==='accent'||k.startsWith('--')){document.documentElement.style.setProperty(k==='accent'?'--accent':k,v);continue;}
      if(k==='clock'){manual=v.trim();tick();continue;}
      if(k==='logo'){const img=document.querySelector('#tag img');const on=v.trim().length>0;
        document.getElementById('tag').classList.toggle('has-logo',on);if(on)img.src=v;else img.removeAttribute('src');continue;}
      document.querySelectorAll('[data-field="'+k+'"]').forEach(e=>e.textContent=v);
      if(k==='desc'||k==='loc')document.querySelector('.'+k).classList.toggle('hide',!v.trim());
    }}
  function play(){root.className='';void root.offsetWidth;root.className='on';}
  function stop(){root.className='off';}
  function next(){}
  tick();setInterval(tick,1000);
</script></body></html>
