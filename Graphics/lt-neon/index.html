<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<style>
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:-apple-system,"Helvetica Neue",sans-serif}
  :root{--accent:#22D3EE;--accent2:#F472B6}
  .box{position:absolute;left:120px;bottom:130px;padding:26px 54px 28px;background:rgba(8,10,18,.82);border-radius:10px;opacity:0}
  .box svg{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);overflow:visible}
  .box rect{fill:none;stroke:url(#g);stroke-width:4;stroke-dasharray:3200;stroke-dashoffset:3200;filter:drop-shadow(0 0 10px var(--accent))}
  .name{color:#fff;font-weight:800;font-size:60px;letter-spacing:1px;text-shadow:0 0 18px rgba(34,211,238,.55);clip-path:inset(0 100% 0 0)}
  .role{color:var(--accent);font-weight:600;font-size:30px;letter-spacing:4px;text-transform:uppercase;margin-top:4px;opacity:0}
  .on .box{animation:show .25s forwards}
  .on rect{animation:draw 1.1s .1s ease-in-out forwards}
  .on .name{animation:type .7s .55s steps(24) forwards}
  .on .role{animation:glow .6s 1.1s ease-out forwards}
  .off .box{opacity:1;animation:out .4s ease-in forwards}.off rect{stroke-dashoffset:0}.off .name{clip-path:none}.off .role{opacity:1}
  @keyframes show{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes type{to{clip-path:inset(0 0 0 0)}}
  @keyframes glow{0%{opacity:0;text-shadow:none}60%{opacity:1;text-shadow:0 0 22px var(--accent)}100%{opacity:1;text-shadow:0 0 8px var(--accent)}}
  @keyframes out{to{opacity:0;filter:blur(6px);transform:scale(.98)}}
</style></head>
<body><div id="root"><div class="box" data-layer="box" data-label="Khung neon">
  <svg preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
  <rect x="0" y="0" width="100%" height="100%" rx="10" ry="10"/></svg>
  <div class="name" id="f0"></div><div class="role" id="f1"></div></div></div>
<script>
  const root=document.getElementById('root');
  function update(d){ if(typeof d==='string') d=JSON.parse(d);
    for(const k in d){ const el=document.getElementById(k); if(el) el.textContent=d[k]; }
    if(d.accent) document.documentElement.style.setProperty('--accent',d.accent);
    if(d.accent2) document.documentElement.style.setProperty('--accent2',d.accent2); }
  function play(){ root.className=''; void root.offsetWidth; root.className='on'; }
  function stop(){ root.className='off'; }
  function next(){}
</script></body></html>
