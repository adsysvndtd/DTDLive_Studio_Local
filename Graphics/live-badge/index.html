<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<!-- DTD Studio · nhãn LIVE + giờ, góc trên phải. -->
<style>
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:"Montserrat","Avenir Next","Helvetica Neue",-apple-system,sans-serif}
  :root{--accent:#C9472F;--paper:#fff}
  .badge{position:absolute;right:80px;top:64px;width:300px;height:150px}
  .back{position:absolute;left:0;top:34px;width:300px;height:76px;background:var(--accent);
        clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);transform:scaleX(0)}
  .face{position:absolute;left:44px;top:0;width:212px;height:104px;background:var(--paper);
        clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);display:flex;align-items:center;justify-content:center;gap:10px;padding-left:18px;box-sizing:border-box;
        transform:scale(.3);opacity:0;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
  .label{color:var(--accent);font-weight:900;font-size:58px;letter-spacing:2px}
  .time{position:absolute;left:96px;top:104px;width:108px;height:40px;line-height:40px;background:var(--paper);text-align:center;
        clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);color:var(--accent);font-weight:800;font-size:24px;opacity:0;transform:translateY(-20px)}
  .on .back{animation:wipe .4s cubic-bezier(.7,0,.2,1) forwards}
  .on .face{animation:pop .5s .15s cubic-bezier(.2,1.5,.4,1) forwards}
  .on .time{animation:down .35s .45s ease-out forwards}
  .off .back{transform:none}.off .face,.off .time{opacity:1;transform:none}
  .off .badge{animation:out .4s ease-in forwards}
  @keyframes wipe{to{transform:none}}
  @keyframes pop{to{transform:none;opacity:1}}
  @keyframes down{to{transform:none;opacity:1}}
  @keyframes out{to{opacity:0;transform:translateY(-40px)}}
  @keyframes blink{50%{opacity:.15}}
  .hide{display:none}
</style></head>
<body><div id="root"><div class="badge">
  <div class="back"></div>
  <div class="face"><span class="dot"></span><span class="label" data-field="label" data-label="Nhãn">LIVE</span></div>
  <div class="time" data-field="clock" data-label="Giờ (để trống = giờ thực, '-' = ẩn)"></div>
</div></div>
<script>
  const root=document.getElementById('root');let manual='';
  function tick(){const t=document.querySelector('.time');t.classList.toggle('hide',manual==='-');
    if(manual){t.textContent=manual;return;}const d=new Date();
    t.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  function update(d){if(typeof d==='string')d=JSON.parse(d);
    for(const k in d){
      if(k==='accent'||k.startsWith('--')){document.documentElement.style.setProperty(k==='accent'?'--accent':k,d[k]);continue;}
      if(k==='clock'){manual=(d[k]||'').trim();tick();continue;}
      document.querySelectorAll('[data-field="'+k+'"]').forEach(e=>e.textContent=d[k]);}}
  function play(){root.className='';void root.offsetWidth;root.className='on';}
  function stop(){root.className='off';}
  function next(){}
  tick();setInterval(tick,1000);
</script></body></html>
