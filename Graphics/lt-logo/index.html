<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<style>
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:-apple-system,"Helvetica Neue",sans-serif}
  :root{--accent:#F26B1D}
  .wrap{position:absolute;left:110px;bottom:120px;display:flex;align-items:stretch;height:150px}
  .logo{width:150px;background:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0) rotate(-90deg);border-radius:6px}
  .logo img{max-width:118px;max-height:118px}
  .logo span{font:900 54px -apple-system;color:var(--accent)}
  .bar{width:10px;background:var(--accent);margin-left:12px;transform:scaleY(0);transform-origin:bottom}
  .panel{overflow:hidden;width:0;background:linear-gradient(90deg,rgba(14,16,22,.96),rgba(14,16,22,.78));display:flex;flex-direction:column;justify-content:center;border-radius:0 6px 6px 0}
  .in{padding:0 46px;white-space:nowrap}
  .head{color:var(--accent);font-weight:900;font-size:24px;letter-spacing:5px;opacity:0;transform:translateY(-12px)}
  .name{color:#fff;font-weight:800;font-size:58px;line-height:1.05;opacity:0;transform:translateX(-30px)}
  .role{color:#cfd3da;font-weight:500;font-size:32px;opacity:0;transform:translateX(-30px)}
  .shine{position:absolute;top:0;left:-30%;width:20%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);opacity:0}
  .on .logo{animation:pop .55s cubic-bezier(.2,1.4,.4,1) forwards}
  .on .bar{animation:grow .35s .35s ease-out forwards}
  .on .panel{animation:open .6s .55s cubic-bezier(.2,.9,.2,1) forwards}
  .on .head{animation:fade .4s 1.0s ease-out forwards}
  .on .name{animation:slide .45s 1.1s ease-out forwards}
  .on .role{animation:slide .45s 1.25s ease-out forwards}
  .on .shine{animation:shine 1.1s 1.6s ease-in-out forwards}
  .off .wrap{animation:out .45s ease-in forwards}
  .off .logo,.off .bar{transform:none}.off .panel{width:var(--w)}.off .head,.off .name,.off .role{opacity:1;transform:none}
  @keyframes pop{to{transform:scale(1) rotate(0)}}
  @keyframes grow{to{transform:scaleY(1)}}
  @keyframes open{to{width:var(--w)}}
  @keyframes fade{to{opacity:1;transform:none}}
  @keyframes slide{to{opacity:1;transform:none}}
  @keyframes shine{0%{opacity:1;left:-30%}100%{opacity:0;left:120%}}
  @keyframes out{to{opacity:0;transform:translateY(40px)}}
</style></head>
<body><div id="root"><div class="wrap">
  <div class="logo" id="logoBox" data-layer="logoBox" data-label="Logo"><span id="mono">D</span></div><div class="bar"></div>
  <div class="panel" id="panel" data-layer="panel" data-label="Khung chữ"><div class="in" id="inner">
    <div class="head" id="f2"></div><div class="name" id="f0"></div><div class="role" id="f1"></div>
  </div><div class="shine"></div></div>
</div></div>
<script>
  const root=document.getElementById('root');
  function size(){ const w=document.getElementById('inner').scrollWidth+4; document.documentElement.style.setProperty('--w',w+'px'); }
  function update(d){ if(typeof d==='string') d=JSON.parse(d);
    for(const k in d){ const el=document.getElementById(k); if(el && k!=='logo') el.textContent=d[k]; }
    if(d.accent) document.documentElement.style.setProperty('--accent',d.accent);
    if(d.logo!==undefined){ const box=document.getElementById('logoBox');
      if(d.logo && d.logo.length>4){ box.innerHTML='<img src="'+d.logo+'">'; }
      else { box.innerHTML='<span id="mono">'+((d.f2||d.f0||'D').trim()[0]||'D')+'</span>'; } }
    size(); }
  function play(){ size(); root.className=''; void root.offsetWidth; root.className='on'; }
  function stop(){ root.className='off'; }
  function next(){}
  size();
</script></body></html>
