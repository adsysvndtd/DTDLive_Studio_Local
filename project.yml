# Generate the Xcode project:  brew install xcodegen && xcodegen generate
name: DTDStudio
options:
  bundleIdPrefix: vn.vnpt.dtd
  deploymentTarget:
    iOS: "17.0"
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: 2.3.0
  RTSPPush:
    path: Packages/RTSPPush
targets:
  DTDStudio:
    type: application
    platform: iOS
    sources: [App/Sources]
    scheme:
      testTargets: [DTDStudioUITests]
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
      - package: RTSPPush
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DTD Studio
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Dùng camera làm nguồn hình cho bàn trộn.
        NSMicrophoneUsageDescription: Thu âm thanh cho chương trình phát trực tiếp.
        NSLocalNetworkUsageDescription: Nhận/phát luồng SRT, RTMP, RTSP trong mạng nội bộ.
        NSPhotoLibraryUsageDescription: Chọn logo để chèn lên hình.
        NSBonjourServices: [_http._tcp, _ndi._tcp]
        # Optional: enable "YouTube Live" / "Facebook Live" buttons (see docs/PLATFORMS.md)
        DTDGoogleClientID: ""
        DTDFacebookAppID: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    # --- NDI (optional) ---------------------------------------------------
    # 1) Download the NDI SDK for iOS from ndi.video, copy into Vendor/NDI/
    #    (libndi_ios.a + headers + a module.modulemap exporting module `NDI`)
    # 2) Uncomment:
    # settings:
    #   base:
    #     SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NDI_SDK"
    #     SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/NDI
    #     LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/NDI
    #     OTHER_LDFLAGS: "-lndi_ios -lc++"

  DTDCam:
    type: application
    platform: iOS
    sources: [CamApp/Sources]
    scheme: {}
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: vn.vnpt.dtd.cam
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CamApp/Info.plist
      properties:
        CFBundleDisplayName: DTD Cam
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: Dùng camera để phát hình về DTD Studio.
        NSMicrophoneUsageDescription: Thu âm thanh gửi về DTD Studio.
        NSLocalNetworkUsageDescription: Tìm và kết nối DTD Studio trong mạng nội bộ.
        NSBonjourServices: [_http._tcp]

  DTDStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: DTDStudio
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: DTDStudio
        GENERATE_INFOPLIST_FILE: YES

  RTSPPushTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Packages/RTSPPush/Tests/RTSPPushTests]
    dependencies:
      - package: RTSPPush
