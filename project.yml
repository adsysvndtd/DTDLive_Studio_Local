# Generate the Xcode project:  brew install xcodegen && xcodegen generate
name: DTDStudio
options:
  bundleIdPrefix: vn.vnpt.dtd
  deploymentTarget:
    iOS: "17.0"
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: 2.3.0
  RTSPPush:
    path: Packages/RTSPPush
targets:
  DTDStudio:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
      - package: RTSPPush
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DTD Studio
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Dùng camera làm nguồn hình cho bàn trộn.
        NSMicrophoneUsageDescription: Thu âm thanh cho chương trình phát trực tiếp.
        NSLocalNetworkUsageDescription: Nhận/phát luồng SRT, RTMP, RTSP trong mạng nội bộ.
        NSPhotoLibraryUsageDescription: Chọn logo để chèn lên hình.
