# Generate the Xcode project:  brew install xcodegen && xcodegen generate
name: DTDStudio
options:
  bundleIdPrefix: vn.com.dtdsolution
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: 2.3.0
  RTSPPush:
    path: Packages/RTSPPush
targets:
  DTDStudio:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - path: Graphics
        type: folder
        buildPhase: resources
    scheme:
      testTargets: [DTDStudioUITests]
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
      - package: RTSPPush
      # SRTKit (from DTDLive): DTDLive camera pairing + multi-camera SRT ingest. Built by Vendor/srtkit/scripts/build-ios.sh
      - framework: Vendor/srtkit/SRTKit.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: VideoToolbox.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.com.dtdsolution.DTDStudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DTDStudio
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations: [vi, en]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Dùng camera làm nguồn hình cho bàn trộn.
        NSMicrophoneUsageDescription: Thu âm thanh cho chương trình phát trực tiếp.
        NSLocalNetworkUsageDescription: Nhận/phát luồng SRT, RTMP, RTSP trong mạng nội bộ.
        NSPhotoLibraryUsageDescription: Chọn ảnh, video, logo và ảnh nền từ Thư viện ảnh để dùng trong chương trình.
        NSPhotoLibraryAddUsageDescription: Lưu video đã ghi và clip replay vào Thư viện ảnh.
        NSBonjourServices: [_dtdstudio._tcp, _dtd-pair._tcp, _http._tcp, _ndi._tcp]
        # Optional: enable "YouTube Live" / "Facebook Live" buttons (see docs/PLATFORMS.md)
        DTDGoogleClientID: "1007472905780-3b4d6gl65igcggb8su86kr4g6p2o8bib.apps.googleusercontent.com"
        DTDFacebookAppID: "4456468081286454"
        DTDFacebookConfigID: "1596868605545622"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          # HDMI / USB-C display gets its own scene (clean PGM) instead of mirroring the iPad screen.
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: ExternalDisplaySceneDelegate
    # --- NDI (optional) ---------------------------------------------------
    # Install "NDI SDK for Apple", run scripts/ndi-setup.sh; build-local.sh then generates
    # from project.ndi.yml (this spec + NDI_SDK flag, include/library paths, -lndi_ios).

  DTDStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: DTDStudio
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: DTDStudio
        GENERATE_INFOPLIST_FILE: YES

  RTSPPushTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Packages/RTSPPush/Tests/RTSPPushTests]
    dependencies:
      - package: RTSPPush
